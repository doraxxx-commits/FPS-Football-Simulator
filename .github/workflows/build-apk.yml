name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find and Unzip any ZIP file
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1) || true
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d temp_unzip
            rm "$ZIP_FILE"
            
            if [ -f temp_unzip/package.json ]; then
              mv temp_unzip/* .
            else
              mv temp_unzip/*/* . || true
            fi
            rm -rf temp_unzip
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web assets directory
        run: |
          mkdir -p www
          cp -r frontend/* www/

      - name: Sync & Build Capacitor
        run: |
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Build APK file
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with raw APK
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: build-${{ github.run_number }}
          name: FPS Simulator APK #${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
